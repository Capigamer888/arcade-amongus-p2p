<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Among Us Arcade - Pantallas Separadas P2P (Hasta 4 Jugadores)</title>
  <link rel="stylesheet" href="style.css">
  <script src="peerjs.min.js"></script>
</head>
<body>
  <header>
    <h1>Among Us Arcade (Pantallas Separadas - 4 Jugadores)</h1>
    <div class="controls">
      <button id="btnHost" onclick="crearSala()">1. Crear Sala (Host)</button>
      <input type="text" id="inputSala" placeholder="Pegar código de sala">
      <button id="btnJoin" onclick="unirseASala()">2. Unirse (Invitado)</button>
      <button id="btnCopy" style="display:none; background-color:#1976d2;" onclick="copiarCodigo()">📋 Copiar Código</button>
      <button id="btnStart" style="display:none; background-color:#2e7d32;" onclick="iniciarPartidaHost()">▶ Iniciar Partida (1/4)</button>
    </div>
    <p id="status">Estado: Desconectado. Crea una sala o únete a una existente.</p>
    <div id="playerList"></div>
    <div style="margin-top: 10px; font-size: 13px; display: flex; justify-content: center; gap: 6px; align-items: center;">
      <label for="inputGameUrl" style="color:#aaa;">Juego Arcade:</label>
      <input type="text" id="inputGameUrl" value="https://arcade.makecode.com/---run?id=S14186-83763-41702-88753" style="width: 380px; padding: 4px 8px; font-size: 12px;">
      <button onclick="cambiarJuego()" style="padding: 4px 12px; font-size: 12px; background-color: #424242;">Recargar</button>
    </div>
  </header>

  <main>
    <iframe id="gameFrame" src="https://arcade.makecode.com/---run?id=S14186-83763-41702-88753"></iframe>
  </main>

  <script>
    const iframe = document.getElementById("gameFrame");
    const statusText = document.getElementById("status");
    const btnStart = document.getElementById("btnStart");
    const btnCopy = document.getElementById("btnCopy");
    const playerList = document.getElementById("playerList");

    function cambiarJuego() {
      let val = document.getElementById("inputGameUrl").value.trim();
      if (!val) return;
      if (val.includes("arcade.makecode.com/") && !val.includes("---run")) {
        const idMatch = val.match(/([S0-9A-Za-z_-]{10,})/);
        if (idMatch) {
          val = "https://arcade.makecode.com/---run?id=" + idMatch[1];
          document.getElementById("inputGameUrl").value = val;
        }
      }
      iframe.src = val;
    }

    let peer = null;
    let esHost = false;
    let miId = null;
    let partidaIniciada = false;
    let salaId = "";

    // Para el Host: clientes conectados { peerId: { id: 2/3/4, conn: c } }
    let clientes = {};
    let proximoId = 2; // 1 es el Host

    // Para el Invitado: conexión con el Host
    let hostConn = null;

    function enviarAlJuego(accionOrObj, valor = "") {
      let accion = accionOrObj;
      let val = valor;
      if (typeof accionOrObj === "object") {
        accion = accionOrObj.accion;
        val = accionOrObj.valor;
      }

      const msgSim = {
        type: "messagepacket",
        channel: "amogus",
        broadcast: true,
        data: Array.from(new TextEncoder().encode(accion + "|" + val))
      };
      const msgDirecto = {
        canal: "amogus_in",
        accion: accion,
        valor: val
      };

      if (!iframe.contentWindow) return;
      iframe.contentWindow.postMessage(msgSim, "*");
      iframe.contentWindow.postMessage(msgDirecto, "*");
      try {
        if (iframe.contentWindow.frames) {
          for (let i = 0; i < iframe.contentWindow.frames.length; i++) {
            iframe.contentWindow.frames[i].postMessage(msgSim, "*");
            iframe.contentWindow.frames[i].postMessage(msgDirecto, "*");
          }
        }
      } catch (e) {}
    }

    function procesarSalidaJuego(accion, valor) {
      if (esHost) {
        if (accion === "pos") {
          const payload = { canal: "amogus_in", accion: "pos", valor: "1," + valor };
          broadcastAClientes(payload);
        } else if (accion === "kill") {
          const payload = { canal: "amogus_in", accion: "kill", valor: valor };
          broadcastAClientes(payload);
        }
      } else {
        if (hostConn && hostConn.open) {
          hostConn.send({ canal: "amogus_out", accion: accion, valor: valor });
        }
      }
    }

    // Escuchar eventos que emite MakeCode desde el iframe
    window.addEventListener("message", (event) => {
      const d = event.data;
      if (!d) return;

      // 1. Mensajes nativos MakeCode simmessages (messagepacket)
      if (d.type === "messagepacket" && d.channel === "amogus" && d.data) {
        let text = "";
        if (typeof d.data === "string") {
          text = d.data;
        } else if (d.data instanceof Uint8Array || Array.isArray(d.data)) {
          text = new TextDecoder().decode(new Uint8Array(d.data));
        }
        const sep = text.indexOf("|");
        if (sep >= 0) {
          procesarSalidaJuego(text.substring(0, sep), text.substring(sep + 1));
        }
        return;
      }

      // 2. Mensajes postMessage directos
      if (d.canal === "amogus_out") {
        procesarSalidaJuego(d.accion, d.valor);
      }
    });

    function broadcastAClientes(msg, ignorarPeerId = null) {
      Object.keys(clientes).forEach(pid => {
        if (pid !== ignorarPeerId) {
          const c = clientes[pid].conn;
          if (c && c.open) {
            c.send(msg);
          }
        }
      });
    }

    function actualizarUIJugadores() {
      const total = 1 + Object.keys(clientes).length;
      btnStart.innerText = `▶ Iniciar Partida (${total}/4)`;
      let html = `<div style="margin-top:6px; color:#a5d6a7;"><strong>Jugadores en sala (${total}/4):</strong><br>`;
      html += `• Jugador 1 (Rojo - Host) [Tú]<br>`;
      Object.keys(clientes).forEach(pid => {
        const id = clientes[pid].id;
        const color = id === 2 ? "Azul" : id === 3 ? "Verde" : "Amarillo";
        html += `• Jugador ${id} (${color}) [Conectado]<br>`;
      });
      html += `</div>`;
      playerList.innerHTML = html;
    }

    function copiarCodigo() {
      if (salaId) {
        navigator.clipboard.writeText(salaId).then(() => {
          alert("¡Código de sala copiado!");
        }).catch(() => {
          prompt("Copia el código manualmente:", salaId);
        });
      }
    }

    // --- MODO HOST ---
    function crearSala() {
      statusText.innerText = "Generando sala P2P...";
      esHost = true;
      miId = 1;
      peer = new Peer();

      peer.on("open", (id) => {
        salaId = id;
        statusText.innerText = "Sala lista. Comparte el código con hasta 3 amigos.";
        btnStart.style.display = "inline-block";
        btnCopy.style.display = "inline-block";
        actualizarUIJugadores();
      });

      peer.on("connection", (c) => {
        const total = 1 + Object.keys(clientes).length;
        if (total >= 4 || partidaIniciada) {
          c.on("open", () => {
            c.send({ canal: "amogus_in", accion: "error", valor: "Sala llena o en partida" });
            c.close();
          });
          return;
        }

        const idAsignado = proximoId++;
        c.on("open", () => {
          clientes[c.peer] = { id: idAsignado, conn: c };
          actualizarUIJugadores();

          // Notificar al invitado de su ID
          c.send({
            canal: "amogus_in",
            accion: "bienvenida",
            valor: idAsignado
          });

          c.on("data", (data) => {
            if (data.accion === "pos") {
              const payload = {
                canal: "amogus_in",
                accion: "pos",
                valor: idAsignado + "," + data.valor
              };
              enviarAlJuego(payload);
              broadcastAClientes(payload, c.peer);
            } else if (data.accion === "kill") {
              const payload = {
                canal: "amogus_in",
                accion: "kill",
                valor: data.valor
              };
              enviarAlJuego(payload);
              broadcastAClientes(payload, c.peer);
            }
          });

          c.on("close", () => {
            delete clientes[c.peer];
            actualizarUIJugadores();
          });
        });
      });
    }

    function iniciarPartidaHost() {
      const total = 1 + Object.keys(clientes).length;
      if (total < 2) {
        alert("Se necesitan al menos 2 jugadores para iniciar la partida.");
        return;
      }
      partidaIniciada = true;
      btnStart.disabled = true;
      btnStart.innerText = "Partida en curso";

      // Impostor aleatorio entre los jugadores (1 a total)
      const impostorId = Math.floor(Math.random() * total) + 1;

      // Iniciar MakeCode local del Host
      setTimeout(() => {
        enviarAlJuego({
          canal: "amogus_in",
          accion: "setup_partida",
          valor: `1,${total},${impostorId}`
        });
      }, 500);

      // Notificar a todos los invitados
      Object.keys(clientes).forEach(pid => {
        const client = clientes[pid];
        client.conn.send({
          canal: "amogus_in",
          accion: "setup_partida",
          valor: `${client.id},${total},${impostorId}`
        });
      });

      statusText.innerText = `¡Partida iniciada con ${total} jugadores! Impostor asignado secretamente.`;
    }

    // --- MODO INVITADO ---
    function unirseASala() {
      const codigo = document.getElementById("inputSala").value.trim();
      if (!codigo) {
        alert("Introduce un código de sala válido");
        return;
      }
      statusText.innerText = "Conectando con la sala...";
      esHost = false;
      peer = new Peer();

      peer.on("open", () => {
        hostConn = peer.connect(codigo);

        hostConn.on("open", () => {
          statusText.innerText = "¡Conectado! Esperando a que el Host inicie la partida...";
        });

        hostConn.on("data", (data) => {
          if (data.accion === "bienvenida") {
            miId = data.valor;
            const color = miId === 2 ? "Azul" : miId === 3 ? "Verde" : "Amarillo";
            playerList.innerHTML = `<span style="color:#81d4fa;"><strong>Conectado como: Jugador ${miId} (${color})</strong></span>`;
          } else if (data.accion === "setup_partida") {
            statusText.innerText = "¡Partida comenzada!";
            enviarAlJuego(data);
          } else {
            enviarAlJuego(data);
          }
        });

        hostConn.on("close", () => {
          statusText.innerText = "El Host se ha desconectado o la sala se cerró.";
        });
      });
    }
  </script>
</body>
</html>
